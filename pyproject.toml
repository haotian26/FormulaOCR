[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formulaocr"
version = "0.3.0"
description = "Offline formula OCR for macOS Apple Silicon"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.28,<2",
  "Pillow>=10,<13",
  "tokenizers>=0.20,<1",
  "PySide6>=6.7,<7",
  "latex2mathml>=3.80,<4",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=12,<13; sys_platform == 'darwin'",
]

[project.scripts]
formulaocr = "main:main"
formulaocr-gui = "main:gui_main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["api*", "app*", "ocr*", "converter*", "clipboard*", "gui*", "sidecar*"]
